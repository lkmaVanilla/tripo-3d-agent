schema: spec-driven

context: |
  Language: zh-CN
  All artifacts must be written in zh-CN.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  项目：Tripo Agent，面向 3D 创作者及行业从业者的资产创作 Agent，通过网页提供服务，优先承担资产制作助手的角色。
  长期方向是围绕用户目标组织资产生成与后续处理，逐阶段扩展骨骼绑定、动画及文字、图片、已有模型等输入；操作及输入条件以 Tripo API 实际开放的能力为边界，具体版本与验收条件另行确定。
  Tripo API 是长期唯一的资产生产与加工能力来源，不接入其他 3D 服务或本地建模工具补齐能力缺口。此限制不涉及 Agent 模型服务、应用调度、下载、技术检查与网页展示；Tripo 已开放的能力仍须由项目接入并验证后才可用，见 ADR 0020。
  长期交互允许在同一会话围绕同一资产持续创作，完成一个目标后可基于已有结果追加后续目标，见 ADR 0021。当前连续创作已按 ADR 0022 实现：会话顺序承载独立 Run，显式引用本会话单个版本，最后 Run 结束后整体保留 7 天，浏览不续期。
  当前 MVP 为文本到静态资产，独立游戏开发者的木箱需求是首个端到端演示案例，不代表项目长期能力上限，也不能替代阶段验收。
  当前连续创作阶段在原静态链路上增加聊天工作台和同会话历史版本减面，保留原 MVP 验收门槛。图片输入、用户模型导入、绑定和动画仍按后续阶段规划。
  技术基线：Go、CloudWeGo Eino ADK 单 Agent、DeepSeek V4 Pro（deepseek-v4-pro）、Tripo API、SQLite 和本地模型目录。
  首版支持匿名多会话与并发访问；每个会话可顺序承载多个目标，每个 Run 由单个 Agent 决策；澄清和纠偏不刷新当前 Run 的预算。
  首条演示是文本需求到静态、自包含 GLB，包含澄清、计划、异步进度、技术检查、有限纠偏、模型预览下载、执行追踪与评测。
  当前 MVP 自动产物验证仅限文件有效性、总三角面数和文件体积；不进行视觉检查。生产次数、模型调用、时限及硬约束由 Go 执行层强制执行。
  保持最小前端，不扩展为通用平台、多 Agent、RAG、Kubernetes、GPU 基础设施或 Tripo Studio 替代品。

  编写变更前阅读仓库根目录 PROJECT_BRIEF.md、CONTEXT.md，以及 docs/adr/ 中与变更相关的决策。
  PROJECT_BRIEF.md 描述当前确认的长期目标与阶段划分，历史目标由 Git 保留；CONTEXT.md 保存已确认约束与术语；docs/adr/ 解释重大技术取舍。
  OpenSpec 管理具体变更的提案、行为规格、设计和实现任务。详细预算、默认值、恢复、匿名归属、数据保留及评测门槛引用现有文档，避免维护互相矛盾的副本。

rules:
  proposal:
    - 明确本次变更的目标、范围和非目标，并引用相关已确认约束。
    - 若需要改变已有共识，明确列出差异及理由，不将新假设写成已确认决定。
  specs:
    - 每项行为要求提供可验证的场景，并区分 Agent 决策、Runtime 保证、工具执行和产物技术检查。
    - API 调用成功不能替代产物验收或 Agent 评测通过；评测要求沿用已确认的案例集与系统回归边界。
  tasks:
    - 按可验证的结果拆分任务，关联相应规格和必要的验证步骤。
    - 区分计划、已完成实现和真实验证证据；未执行的 API 接入或评测不得标记为通过。
